<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B 站视频下载器</title>
<script>
  // 桌面窗口模式：由 desktop.py 以 ?desktop=1 打开，首帧前就打好标记，避免闪烁
  if (location.search.indexOf("desktop=1") > -1) document.documentElement.classList.add("desktop");
</script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- 背景光晕：玻璃需要“有东西可以折射”才有质感 -->
<div class="aurora" aria-hidden="true">
  <i class="blob b1"></i>
  <i class="blob b2"></i>
  <i class="blob b3"></i>
  <i class="grain"></i>
</div>

<!-- 自绘标题栏（仅桌面窗口模式显示） -->
<header class="titlebar">
  <div class="titlebar-drag">
    <span class="tb-mark">B</span>
    <span class="tb-title">B 站视频下载器</span>
  </div>
  <div class="win-controls">
    <button class="win-btn" data-win="min" type="button" title="最小化" aria-label="最小化">
      <svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.1">
        <path d="M2 6h8"></path>
      </svg>
    </button>
    <button class="win-btn" data-win="max" type="button" title="最大化" aria-label="最大化">
      <svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.1">
        <rect x="2.2" y="2.2" width="7.6" height="7.6" rx="1.2"></rect>
      </svg>
    </button>
    <button class="win-btn close" data-win="close" type="button" title="关闭" aria-label="关闭">
      <svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.2">
        <path d="M2.6 2.6l6.8 6.8M9.4 2.6L2.6 9.4"></path>
      </svg>
    </button>
  </div>
</header>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="logo">B</span>
      <div class="brand-text">
        <h1>B 站视频下载器</h1>
        <p>粘贴链接，自动解析并保存到本地</p>
      </div>
    </div>
    <div class="topbar-right">
      <span id="chips" class="chips"></span>
      <button id="btnSettings" class="icon-btn glass" title="设置" aria-label="设置">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"></path>
        </svg>
      </button>
    </div>
  </header>

  <section class="search">
    <form id="parseForm" class="search-box glass" autocomplete="off">
      <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path>
      </svg>
      <input id="urlInput" type="text" placeholder="粘贴视频链接、BV 号或分享文案…" spellcheck="false">
      <button id="btnParse" class="glass-strong" type="submit">解析</button>
    </form>

    <div id="parseProgress" class="parse-progress hidden">
      <div class="pp-track"><div id="ppFill" class="pp-fill"></div></div>
      <div class="pp-meta">
        <span id="ppStage">准备中</span>
        <span id="ppPercent" class="pp-percent">0%</span>
      </div>
    </div>

    <div class="hint">支持 BV / av 号、b23.tv 短链、App 分享文案；粘贴后回车即可</div>
  </section>

  <div id="alert" class="alert hidden"></div>

  <section id="result" class="card glass hidden">
    <div class="result-main">
      <div class="cover-wrap">
        <img id="cover" alt="视频封面" referrerpolicy="no-referrer">
        <span id="duration" class="duration"></span>
      </div>
      <div class="meta">
        <h2 id="videoTitle"></h2>
        <div id="metaRow" class="meta-row"></div>
        <div id="pageRow" class="page-row hidden">
          <label class="field">
            <span>分集</span>
            <div id="pageSelect" class="dd"></div>
          </label>
        </div>
        <div class="controls">
          <label class="field">
            <span>清晰度</span>
            <div id="qualitySelect" class="dd"></div>
          </label>
          <label class="field" id="codecField">
            <span>编码</span>
            <div id="codecSelect" class="dd"></div>
          </label>
          <label class="field" id="audioField">
            <span>音轨</span>
            <div id="audioSelect" class="dd"></div>
          </label>
        </div>
        <div class="actions">
          <div class="seg glass" id="modeSeg">
            <button type="button" data-mode="video" class="active">视频 MP4</button>
            <button type="button" data-mode="audio" data-fmt="m4a">音频 M4A</button>
            <button type="button" data-mode="audio" data-fmt="mp3">音频 MP3</button>
          </div>
          <div class="action-right">
            <button id="btnDownloadAll" class="ghost-btn glass hidden" type="button">下载全部</button>
            <button id="btnDownload" class="primary glass-strong" type="button">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 3v12"></path><path d="m7 12 5 5 5-5"></path><path d="M4 21h16"></path>
              </svg>
              开始下载
            </button>
          </div>
        </div>
        <div id="lockedTip" class="locked-tip hidden"></div>
      </div>
    </div>
  </section>

  <section class="tasks">
    <div class="section-head">
      <h2>下载任务</h2>
      <div class="section-actions">
        <button id="btnFolder" class="ghost-btn glass" type="button">打开下载目录</button>
      </div>
    </div>
    <div id="taskList" class="task-list"></div>
    <div id="taskEmpty" class="empty">还没有下载任务</div>
  </section>

  <footer class="footnote">仅用于个人学习与备份，请尊重 UP 主版权，勿用于商业传播</footer>
</div>

<div id="settingsModal" class="modal hidden">
  <div class="modal-mask" data-close="1"></div>
  <div class="modal-card glass">
    <div class="modal-head">
      <h3>设置</h3>
      <button class="icon-btn glass" data-close="1" aria-label="关闭">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6 6 18M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <div class="modal-body">
      <div class="modal-field">
        <span class="label-line">
          账号
          <em id="loginState" class="state"></em>
        </span>
        <button id="btnLogin" class="login-btn glass" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <path d="M10 17l5-5-5-5"></path><path d="M15 12H3"></path>
          </svg>
          打开 B 站登录窗口，自动获取 Cookie
        </button>
        <small>点开后在内嵌的登录窗口里扫码或账号登录，成功后自动保存 Cookie 并解锁高清画质，无需手动复制。</small>
      </div>

      <label class="modal-field">
        <span class="label-line">
          登录 Cookie（SESSDATA）
          <em id="cookieState" class="state"></em>
        </span>
        <textarea id="sessdataInput" rows="2" placeholder="选填。自动登录失败时可手动粘贴 SESSDATA"></textarea>
        <small>也可以在浏览器登录 bilibili.com → F12 → Application → Cookies → 复制 SESSDATA 的值。仅保存在本机 config.json。</small>
      </label>

      <label class="modal-field">
        <span class="label-line">下载线程数</span>
        <input id="threadsInput" type="number" min="1" max="16" step="1">
        <small>8 左右通常最快，过高可能触发限速。</small>
      </label>

      <div class="modal-field">
        <span class="label-line">网络</span>
        <label class="check-row">
          <input id="proxyInput" type="checkbox">
          <span>通过系统代理访问 B 站</span>
        </label>
        <small>默认直连。仅在海外网络或公司内网必须走代理时才勾选，勾错会导致解析超时。</small>
      </div>

      <div class="modal-field">
        <span class="label-line">环境状态</span>
        <div id="envInfo" class="env-info"></div>
      </div>
    </div>

    <div class="modal-foot">
      <button id="btnSaveSettings" class="primary glass-strong" type="button">保存设置</button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
